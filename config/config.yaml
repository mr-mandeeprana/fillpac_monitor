# =============================================================================
# FillPac Operator Monitor - Configuration
# =============================================================================
# Architecture:
#
# RTSP Camera
#     ↓
# YOLO26N Pose
#     ↓
# Person + Shoulder/Elbow/Wrist
#     ↓
# MediaPipe Hand (21 landmarks)
#     ↓
# Work Zone
#     ↓
# WORKING / NOT WORKING / NO OPERATOR
#     ↓
# ┌───────────────────────┬────────────────────────┐
# │                       │                        │
# SQL Server         Elasticsearch               │
#                         ↓                        │
#                       Kibana                    │
#
# =============================================================================


# =============================================================================
# STATION
# =============================================================================

station:

  id: "FILLPAC-01"

  name: "FillPac Line 1"


# =============================================================================
# CAMERA
# =============================================================================

camera:

  # ---------------------------------------------------------------------------
  # RTSP SOURCE
  # ---------------------------------------------------------------------------
  #
  # CAMERA_URL from .env can override this value if your application supports
  # that override.
  #
  source: "rtsp://${CAMERA_USER}:${CAMERA_PASS}@172.20.45.131:554/video/live?channel=1&subtype=1"


  # ---------------------------------------------------------------------------
  # STARTUP / WARMUP
  # ---------------------------------------------------------------------------

  warmup_attempts: 15

  warmup_delay_sec: 0.15


  # ---------------------------------------------------------------------------
  # RECONNECTION
  # ---------------------------------------------------------------------------

  reconnect_delay_sec: 1.0

  max_consecutive_failures: 30


  # ---------------------------------------------------------------------------
  # CONNECTION / READ TIMEOUT
  # ---------------------------------------------------------------------------

  connect_timeout_ms: 3000

  read_timeout_ms: 3000


  # ---------------------------------------------------------------------------
  # LOW-LATENCY RTSP / FFMPEG
  # ---------------------------------------------------------------------------
  #
  # TCP:
  #   Reliable for factory network.
  #
  # stimeout:
  #   Prevents connection from waiting indefinitely.
  #
  # max_delay:
  #   Keeps network buffering low.
  #
  # reorder_queue_size:
  #   Prevents unnecessary frame buffering.
  #
  ffmpeg_options: "rtsp_transport;tcp|stimeout;3000000|max_delay;50000|reorder_queue_size;0"


  # ---------------------------------------------------------------------------
  # THREADED CAPTURE
  # ---------------------------------------------------------------------------
  #
  # Camera capture should run independently from YOLO inference.
  #
  # The capture thread should always keep the latest frame rather than allowing
  # a large queue of old frames to build up.
  #
  use_threaded_capture: true


  # ---------------------------------------------------------------------------
  # CAMERA FPS
  # ---------------------------------------------------------------------------

  target_fps: 25


# =============================================================================
# MODELS
# =============================================================================

models:

  # ---------------------------------------------------------------------------
  # YOLO POSE
  # ---------------------------------------------------------------------------

  pose_model_path: "models/yolo26n-pose.pt"


  # ---------------------------------------------------------------------------
  # MEDIAPIPE HAND LANDMARKER
  # ---------------------------------------------------------------------------

  hand_landmarker_path: "models/hand_landmarker.task"

  hand_landmarker_url: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"


  # ---------------------------------------------------------------------------
  # DEVICE
  # ---------------------------------------------------------------------------
  #
  # Current system:
  # CPU
  #
  device: "cpu"


  # ---------------------------------------------------------------------------
  # YOLO CONFIDENCE
  # ---------------------------------------------------------------------------

  yolo_conf_threshold: 0.25

  yolo_iou_threshold: 0.25


  # ---------------------------------------------------------------------------
  # YOLO INFERENCE WIDTH
  # ---------------------------------------------------------------------------
  #
  # Lower value:
  #   Faster CPU inference
  #
  # Higher value:
  #   Better detection detail
  #
  # Current CPU setting:
  # 320
  #
  inference_width: 320


  # ---------------------------------------------------------------------------
  # POSE KEYPOINT CONFIDENCE
  # ---------------------------------------------------------------------------

  keypoint_conf_threshold: 0.40


  # ---------------------------------------------------------------------------
  # MEDIAPIPE HAND SETTINGS
  # ---------------------------------------------------------------------------

  hand_max_num: 2

  hand_detection_conf: 0.5

  hand_tracking_conf: 0.5


  # ---------------------------------------------------------------------------
  # HAND CROP PADDING
  # ---------------------------------------------------------------------------

  hand_crop_padding: 60


# =============================================================================
# ZONES
# =============================================================================
#
# IMPORTANT:
#
# There is NO operator zone.
#
# The COMPLETE CAMERA FRAME is the operator-presence area.
#
# Only ONE manually configured polygon exists:
#
#                   WORK ZONE
#
# Hand/wrist movement inside this zone is used for working detection.
#
# =============================================================================

zones:

  # ---------------------------------------------------------------------------
  # INTERACTIVE WORK-ZONE DRAWING
  # ---------------------------------------------------------------------------

  interactive_draw_on_first_run: true


  # ---------------------------------------------------------------------------
  # DEFAULT WORK ZONE
  # ---------------------------------------------------------------------------
  #
  # Coordinates are fractions of the camera frame:
  #
  # X = 0.0 -> 1.0
  # Y = 0.0 -> 1.0
  #
  # Default:
  #
  #        35%             75%
  #         ┌───────────────┐
  #         │               │
  #  25%    │   WORK ZONE   │
  #         │               │
  #  75%    │               │
  #         └───────────────┘
  #
  work_zone_fractions:

    - [0.35, 0.25]

    - [0.75, 0.25]

    - [0.75, 0.75]

    - [0.35, 0.75]


# =============================================================================
# OPERATOR MONITOR
# =============================================================================

monitor:

  # ---------------------------------------------------------------------------
  # HAND / WRIST MOVEMENT
  # ---------------------------------------------------------------------------
  #
  # Minimum movement required to classify activity as movement.
  #
  hand_movement_threshold_px: 4.0


  # ---------------------------------------------------------------------------
  # MOVEMENT HISTORY
  # ---------------------------------------------------------------------------

  history_window_frames: 8


  # ---------------------------------------------------------------------------
  # MINIMUM HISTORY
  # ---------------------------------------------------------------------------

  min_history_for_judgement: 2


  # ---------------------------------------------------------------------------
  # OPERATOR ABSENCE
  # ---------------------------------------------------------------------------
  #
  # Entire camera frame = operator area.
  #
  # If the tracked operator disappears for this amount of time:
  #
  #     NO OPERATOR
  #
  operator_absence_timeout_sec: 2.0


  # ---------------------------------------------------------------------------
  # NOT WORKING TIMEOUT
  # ---------------------------------------------------------------------------
  #
  # WORKING:
  #
  #     Person present
  #          +
  #     Hand/wrist in work zone
  #          +
  #     Movement detected
  #
  #     => WORKING immediately
  #
  #
  # NOT WORKING:
  #
  #     If working movement stops, remain WORKING temporarily.
  #
  #     After this timeout:
  #
  #     => NOT WORKING
  #
  not_working_timeout_sec: 3.0


  # ---------------------------------------------------------------------------
  # STATUS DEBOUNCE
  # ---------------------------------------------------------------------------
  #
  # Keep at 0 so WORKING is not artificially delayed.
  #
  # NOT WORKING delay is controlled independently by:
  #
  #     not_working_timeout_sec
  #
  status_debounce_sec: 0.0


  # ---------------------------------------------------------------------------
  # HEARTBEAT
  # ---------------------------------------------------------------------------
  #
  # Send application heartbeat to Elasticsearch / monitoring system.
  #
  heartbeat_interval_sec: 60


# =============================================================================
# DISPLAY
# =============================================================================

display:

  # OpenCV live window
  show_window: true


  # ---------------------------------------------------------------------------
  # YOLO POSE SKELETON
  # ---------------------------------------------------------------------------
  #
  # Draw:
  #
  # Left:
  #   Shoulder -> Elbow -> Wrist
  #
  # Right:
  #   Shoulder -> Elbow -> Wrist
  #
  draw_skeleton: true


  # ---------------------------------------------------------------------------
  # MEDIAPIPE HAND
  # ---------------------------------------------------------------------------
  #
  # Draw complete 21-point hand.
  #
  draw_hand_landmarks: true


# =============================================================================
# APPLICATION LOGGING
# =============================================================================

logging:

  # Log directory
  log_dir: "logs"


  # ---------------------------------------------------------------------------
  # LOG LEVEL
  # ---------------------------------------------------------------------------

  # Available:
  # DEBUG
  # INFO
  # WARNING
  # ERROR
  #
  log_level: "INFO"


  # ---------------------------------------------------------------------------
  # ROTATING LOG FILE
  # ---------------------------------------------------------------------------

  # 10 MB
  max_bytes: 10485760


  # Keep 10 backup files
  backup_count: 10


  # ---------------------------------------------------------------------------
  # SQL LOGGING
  # ---------------------------------------------------------------------------
  #
  # If true, application events are also written to SQL Server.
  #
  also_log_to_db: true


# =============================================================================
# DATABASE - SQL SERVER
# =============================================================================
#
# Credentials should come from .env.
#
# Example:
#
# DB_SERVER=...
# DB_DATABASE=...
# DB_USERNAME=...
# DB_PASSWORD=...
#
# =============================================================================

database:

  enabled: true


  # ---------------------------------------------------------------------------
  # ODBC DRIVER
  # ---------------------------------------------------------------------------

  driver: "{ODBC Driver 18 for SQL Server}"


  # ---------------------------------------------------------------------------
  # CONNECTION TIMEOUT
  # ---------------------------------------------------------------------------

  connect_timeout_sec: 5


  # ---------------------------------------------------------------------------
  # ENCRYPTION
  # ---------------------------------------------------------------------------

  encrypt: true


  # ---------------------------------------------------------------------------
  # SQL SERVER CERTIFICATE
  # ---------------------------------------------------------------------------
  #
  # Development / internal network:
  #
  # true
  #
  # Production with valid certificate:
  #
  # false
  #
  trust_server_certificate: true


  # ---------------------------------------------------------------------------
  # DATABASE WRITE QUEUE
  # ---------------------------------------------------------------------------

  write_queue_max_size: 5000


  # ---------------------------------------------------------------------------
  # BATCH FLUSH
  # ---------------------------------------------------------------------------

  batch_flush_interval_sec: 2.0

  batch_flush_max_rows: 200


  # ---------------------------------------------------------------------------
  # RETRY BACKOFF
  # ---------------------------------------------------------------------------

  retry_backoff_sec:

    - 1

    - 2

    - 5

    - 10

    - 30


# =============================================================================
# ELASTICSEARCH / ELK
# =============================================================================
#
# Architecture:
#
# Python Application
#        │
#        ▼
# Elasticsearch
#        │
#        ▼
#      Kibana
#
# Elasticsearch is the data store.
# Kibana reads the Elasticsearch index and creates dashboards.
#
# IMPORTANT:
#
# This section MUST be at the same level as "database".
#
# =============================================================================

elk:

  # ---------------------------------------------------------------------------
  # ENABLE ELASTICSEARCH
  # ---------------------------------------------------------------------------

  enabled: false


  # ---------------------------------------------------------------------------
  # ELASTICSEARCH HOST
  # ---------------------------------------------------------------------------
  #
  # Local Elasticsearch:
  #
  #     http://localhost:9200
  #
  # Remote Elasticsearch:
  #
  #     http://SERVER_IP:9200
  #
  host: "http://localhost:9200"


  # ---------------------------------------------------------------------------
  # INDEX
  # ---------------------------------------------------------------------------
  #
  # All FillPac operator monitoring events will be stored here.
  #
  index_name: "fillpac-operator-monitoring"


  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------
  #
  # Leave empty if authentication is disabled.
  #
  # Prefer loading these values from .env for production.
  #
  username: ""

  password: ""


  # ---------------------------------------------------------------------------
  # API KEY
  # ---------------------------------------------------------------------------
  #
  # If API key authentication is used, put it here or load it from .env.
  #
  api_key: ""


  # ---------------------------------------------------------------------------
  # SSL CERTIFICATE
  # ---------------------------------------------------------------------------
  #
  # Local HTTP Elasticsearch:
  #
  # false
  #
  # HTTPS production Elasticsearch with valid certificate:
  #
  # true
  #
  verify_certs: false


  # ---------------------------------------------------------------------------
  # BACKGROUND QUEUE
  # ---------------------------------------------------------------------------
  #
  # IMPORTANT FOR LOW LATENCY.
  #
  # Camera/YOLO processing should NOT wait for Elasticsearch.
  #
  # Application:
  #
  #     YOLO
  #       ↓
  #     Status
  #       ↓
  #     Queue
  #
  # Background worker:
  #
  #     Queue
  #       ↓
  #     Elasticsearch
  #
  queue_size: 5000


  # ---------------------------------------------------------------------------
  # HEARTBEAT
  # ---------------------------------------------------------------------------

  heartbeat_interval_sec: 60
