# =============================================================================
# FillPac Operator Monitor - Configuration
# Secrets (camera password, DB credentials) live in .env, NOT here.
# =============================================================================

station:
  id: "FILLPAC-01"          # unique ID for this camera/station, used as DB key
  name: "FillPac Line 1"

camera:
  # If CAMERA_URL is set in .env / environment, it overrides this.
  source: "rtsp://${CAMERA_USER}:${CAMERA_PASS}@172.20.45.131:554/video/live?channel=1&subtype=1"
  warmup_attempts: 15
  warmup_delay_sec: 0.15
  reconnect_delay_sec: 2.0
  max_consecutive_failures: 30
  connect_timeout_ms: 5000
  read_timeout_ms: 5000
  ffmpeg_options: "rtsp_transport;tcp|stimeout;5000000|max_delay;200000|reorder_queue_size;64"
  use_threaded_capture: true
  target_fps: 30

models:
  pose_model_path: "models/yolo26n-pose.pt"
  hand_landmarker_path: "models/hand_landmarker.task"
  hand_landmarker_url: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  device: "cpu"
  yolo_conf_threshold: 0.25
  yolo_iou_threshold: 0.25
  inference_width: 416
  keypoint_conf_threshold: 0.40
  hand_max_num: 2
  hand_detection_conf: 0.5
  hand_tracking_conf: 0.5
  hand_crop_padding: 60

zones:
  # Zones are persisted per-station in zones_config/<station_id>.json after first draw.
  # These fractional defaults are only used if no saved zone file exists AND
  # interactive drawing is disabled.
  interactive_draw_on_first_run: true
  operator_zone_fractions: [[0.10, 0.10], [0.90, 0.10], [0.90, 0.95], [0.10, 0.95]]
  work_zone_fractions: [[0.35, 0.25], [0.75, 0.25], [0.75, 0.75], [0.35, 0.75]]

monitor:
  hand_movement_threshold_px: 4.0
  history_window_frames: 8
  min_history_for_judgement: 2
  operator_absence_timeout_sec: 2.0
  status_debounce_sec: 0.1     # was 1.5 — near-instant now
  heartbeat_interval_sec: 60
  
display:
  show_window: true          # set false for headless/production servers
  draw_skeleton: true
  draw_hand_landmarks: true

logging:
  log_dir: "logs"
  log_level: "INFO"          # DEBUG / INFO / WARNING / ERROR
  max_bytes: 10485760        # 10 MB per log file
  backup_count: 10
  also_log_to_db: true

database:
  enabled: true
  driver: "{ODBC Driver 18 for SQL Server}"
  # server/database/user/password come from .env — this file only has
  # non-secret behavior settings.
  connect_timeout_sec: 5
  encrypt: true
  trust_server_certificate: true   # set false in real prod with a valid cert
  write_queue_max_size: 5000
  batch_flush_interval_sec: 2.0
  batch_flush_max_rows: 200
  retry_backoff_sec: [1, 2, 5, 10, 30]
